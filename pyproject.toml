[project]
name = "swarm"
version = "0.1.0"
description = "A swarm of identical Claude agents building a US economy simulator"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=0.80",
]

[project.scripts]
swarm = "swarm.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["swarm"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
